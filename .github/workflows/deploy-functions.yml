# Deploys the Supabase Edge Functions NAMED BELOW -- and only those -- when a
# merge to main changes one (the user chose this route, 2026-11-17).
#
# Deliberately a list, not "every function in supabase/functions": daily-digest
# and scheduled-export SEND MAIL on a timer and have never been deployed; they
# go live only when somebody decides to add them here.
#
# Needs the repository secret SUPABASE_ACCESS_TOKEN (Supabase -> Account ->
# Access Tokens; GitHub -> Settings -> Secrets and variables -> Actions).
# The function's own secrets (ANTHROPIC_API_KEY) live in Supabase, not here.
name: Deploy Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/read-report-box/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: issxxmgsffszqbxugqis
    steps:
      - uses: actions/checkout@v4
      - name: The access token is set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the repository secret SUPABASE_ACCESS_TOKEN (Supabase -> Account -> Access Tokens), then re-run this workflow."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy read-report-box (JWT verification ON)
        run: supabase functions deploy read-report-box --project-ref "$PROJECT_REF"
